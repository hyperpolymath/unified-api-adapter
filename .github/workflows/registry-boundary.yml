name: Registry boundary
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: registry-boundary-${{ github.ref }}
  cancel-in-progress: true
jobs:
  registry:
    name: Idris decoder and registration
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      IDRIS_REF: b6cbc25d5cd2ef2a250556266fd7b68dfc360f8b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install compiler dependencies
        run: sudo apt-get update && sudo apt-get install -y chezscheme libgmp-dev
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: idris-cache
        with:
          path: ~/.idris2
          key: registry-refc-${{ runner.os }}-${{ runner.arch }}-${{ env.IDRIS_REF }}
      - name: Build pinned Idris compiler
        if: steps.idris-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/idris2"
          git -C "$RUNNER_TEMP/idris2" remote add origin https://github.com/idris-lang/Idris2.git
          git -C "$RUNNER_TEMP/idris2" fetch --depth 1 origin "$IDRIS_REF"
          git -C "$RUNNER_TEMP/idris2" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/idris2" rev-parse HEAD)" = "$IDRIS_REF"
          cd "$RUNNER_TEMP/idris2"
          make bootstrap SCHEME=chezscheme
          make install
      - name: Add Idris to PATH
        run: echo "$HOME/.idris2/bin" >> "$GITHUB_PATH"
      - name: Provision pinned Zig for the actual C ABI caller
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --proto '=https' --proto-redir '=https' --connect-timeout 20 --max-time 120 -fL https://zigmirror.hryx.net/zig/zig-x86_64-linux-0.15.2.tar.xz -o zig.tar.xz || \
            curl --proto '=https' --proto-redir '=https' --connect-timeout 20 --max-time 120 -fL https://zig.linus.dev/zig/zig-x86_64-linux-0.15.2.tar.xz -o zig.tar.xz || \
            curl --proto '=https' --proto-redir '=https' --connect-timeout 20 --max-time 120 -fL https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz -o zig.tar.xz
          echo '02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239  zig.tar.xz' | sha256sum -c -
          tar -xf zig.tar.xz
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.15.2" >> "$GITHUB_PATH"
      - name: Total proofs and actual C ABI differential execution
        run: |
          set -euo pipefail
          # An inherited producer override must not select an old oracle.
          EVIDENCE_DIR="$RUNNER_TEMP/unused-oracle" bash scripts/check-runtime-registry.sh
          test ! -e "$RUNNER_TEMP/unused-oracle"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: registry-boundary-evidence
          path: |
            build/registry-evidence/
            build/runtime-registry-evidence/
          if-no-files-found: error

